# 모터 ID 와 오프셋. 손가락 하나에 모터 2개(차동 구조)다.
#
# 출처: AmazingHand (https://github.com/pollen-robotics/AmazingHand)
#       Demo/AHControl/config/r_hand.toml, Apache License 2.0
# 변경: 최상단에 baudrate 를 추가했다.
#
# 아래 offset 은 upstream 기본값이다. 손을 새로 조립했거나 서보를
# 교체했으면 실측해서 고칠 것. 사본을 두 곳에 두지 말 것 -- 예전에
# 오프셋 사본이 원본과 어긋나 손가락이 엉뚱한 각도로 간 적이 있다.

# Config for the right index finger1
baudrate = 1000000

[Fingers]
[[motors]]
finger_name="r_finger1"
motor1.id = 1
motor1.offset = 0.12217304763960307
motor1.invert = false
motor1.model = "SCS0009"
